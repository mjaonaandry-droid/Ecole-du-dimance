name: Construire l'APK

# Ce fichier DOIT rester à la racine du dépôt (.github/workflows/) : GitHub ignore
# les workflows situés dans un sous-dossier. Le projet Android se trouve dans « Ecole-du-dimance/ ».
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: Ecole-du-dimance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Cache des dépendances Gradle (et du cache de compilation) : les builds suivants sont bien plus rapides.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Ecole-du-dimance/**/*.gradle.kts', 'Ecole-du-dimance/gradle/libs.versions.toml', 'Ecole-du-dimance/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Le runner ubuntu-latest fournit déjà un SDK Android (ANDROID_HOME) : on s'assure seulement
      # de la présence de la plateforme 36 et des build-tools, et on accepte les licences.
      - name: SDK Android 36 et licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" \
            || sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Préparer gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Compiler l'APK de débogage
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Tests unitaires
        if: ${{ !cancelled() }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug --stacktrace --console=plain

      # Compile aussi les tests instrumentés (Room sur la vraie base) : ils sont exécutés par le job « emulateur ».
      - name: Compiler l'APK des tests instrumentés
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --console=plain

      # La variante release doit aussi compiler (garde-fou INTERNET et lintVital inclus). Sans clé de signature
      # elle reste NON SIGNÉE, donc non installable : elle n'est volontairement pas publiée (voir README).
      - name: Compiler la variante release (non signée, non publiée)
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace --console=plain
          ls -l app/build/outputs/apk/release/

      # Contrôle indépendant de la permission INTERNET sur l'APK réellement produit.
      - name: Permissions déclarées par l'APK
        if: ${{ !cancelled() }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "Aucun APK produit."; exit 1; }
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "ERREUR : la permission INTERNET est présente dans l'APK."
            exit 1
          fi
          echo "OK : aucune permission INTERNET dans l'APK."

      - name: Enregistrer l'APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Ecole-du-dimance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Enregistrer l'APK des tests instrumentés
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-androidTest-apk
          path: Ecole-du-dimance/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn

      - name: Enregistrer les rapports (tests, lint)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            Ecole-du-dimance/app/build/reports/tests
            Ecole-du-dimance/app/build/reports/lint-results-debug.html
            Ecole-du-dimance/app/build/test-results
            Ecole-du-dimance/app/schemas
          if-no-files-found: ignore

      # Tout ce qui suit est AFFICHÉ dans le journal : les chiffres cités dans le README viennent de là.
      - name: Résumé vérifiable (tests, lint, APK, sauvegarde, schéma Room)
        if: ${{ !cancelled() }}
        run: |
          echo "################ TESTS UNITAIRES (rapports JUnit XML) ################"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = echecs = erreurs = ignores = 0
          fichiers = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          for chemin in fichiers:
              racine = ET.parse(chemin).getroot()
              n, f, e, s = (int(racine.get(k)) for k in ('tests', 'failures', 'errors', 'skipped'))
              total += n; echecs += f; erreurs += e; ignores += s
              print(f"  {racine.get('name').split('.')[-1]:48s} tests={n:3d} échecs={f} erreurs={e} ignorés={s}")
          print(f"TOTAL : {total} tests dans {len(fichiers)} classes, {echecs} échecs, {erreurs} erreurs, {ignores} ignorés")
          PY
          echo
          echo "################ LINT (lint-results-debug.xml) ################"
          python3 - <<'PY'
          import collections, os, xml.etree.ElementTree as ET
          chemin = 'app/build/reports/lint-results-debug.xml'
          if not os.path.exists(chemin):
              print("Pas de lint-results-debug.xml")
          else:
              anomalies = list(ET.parse(chemin).getroot().iter('issue'))
              print("Anomalies par sévérité :", dict(collections.Counter(a.get('severity') for a in anomalies)))
              for a in sorted(anomalies, key=lambda a: (a.get('severity'), a.get('id'))):
                  lieu = a.find('location')
                  lieu_txt = f"{lieu.get('file', '?').split('app/')[-1]}:{lieu.get('line', '?')}" if lieu is not None else '?'
                  print(f"  [{a.get('severity')}] {a.get('id')} — {a.get('message')[:150]} ({lieu_txt})")
          PY
          echo
          echo "################ APK ################"
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools utilisés : $BT"
          ls -l "$APK"
          sha256sum "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package:|sdkVersion|minSdkVersion|targetSdkVersion|application-label:|application-label-fr|launchable-activity|uses-feature|uses-implied-feature)" || true
          echo "--- Sauvegarde / réseau dans le manifeste de l'APK :"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "allowBackup|dataExtractionRules|fullBackupContent|usesCleartextTraffic|debuggable|android:name\(0x01010003\)=\"mg" || true
          echo "--- Signature de l'APK (clé de débogage Android) :"
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -8 || true
          echo
          echo "################ SCHÉMA ROOM ################"
          ls -l app/schemas/*/*.json
          sha256sum app/schemas/*/*.json
          # La compilation régénère le schéma sur place : s'il diffère du fichier versionné, git le voit.
          if git diff --quiet -- app/schemas; then
            echo "OK : le schéma généré par la compilation est identique au schéma versionné."
          else
            echo "ATTENTION : le schéma généré diffère du schéma versionné :"; git diff --stat -- app/schemas
          fi

  # Vérification sur un émulateur Android 14 : tests instrumentés Room (vraie base SQLite) puis parcours réel
  # de l'application en mode avion. L'émulateur n'a pas la vraie caméra : cela ne remplace pas un essai sur téléphone.
  # « continue-on-error » : un émulateur capricieux ne doit jamais masquer qu'un APK a bien été produit.
  emulateur:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apks

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-androidTest-apk
          path: apks

      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # L'émulateur (QEMU) a besoin de libpulse0, absente de l'image du runner (erreur observée :
      # « libpulse.so.0: cannot open shared object file »).
      - name: Bibliothèques système de l'émulateur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          sudo apt-get install -y -qq libxkbfile1 libnss3 libasound2t64 || true

      - name: Image système Android 14 et AVD
        run: |
          # Dossier d'AVD explicite et identique pour la création et le lancement.
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          AVDM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/avdmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" | tail -3
          echo no | "$AVDM" create avd --force -n ci -k "system-images;android-34;google_apis;x86_64" -d pixel_6
          echo "AVD créés :"; "$ANDROID_HOME/emulator/emulator" -list-avds; ls -la "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Démarrer l'émulateur
        run: |
          echo "--- utilisateur : $(id)"; ls -l /dev/kvm || true; nproc; free -m | head -2
          "$ANDROID_HOME/emulator/emulator" -version | head -3 || true
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          QEMU="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          if [ -x "$QEMU" ]; then
            echo "Bibliothèques manquantes pour QEMU :"; (ldd "$QEMU" | grep "not found") || echo "  aucune"
          fi
          adb start-server
          # setsid : l'émulateur ne reste attaché ni à cette étape ni à ses flux (sinon l'étape ne se termine jamais).
          setsid nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -memory 3072 -camera-back virtualscene -camera-front emulated \
            > emulateur.log 2>&1 < /dev/null &
          echo "émulateur lancé (pid $!)"
          for i in $(seq 1 72); do   # 72 x 5 s = 6 minutes au plus
            if ! pgrep -f "qemu-system" > /dev/null && ! pgrep -f "emulator -avd ci" > /dev/null; then
              echo "ERREUR : le processus de l'émulateur s'est arrêté."; break
            fi
            etat="$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$etat" = "1" ] && { echo "démarré après ~$((i * 5)) s"; break; }
            if [ $((i % 6)) -eq 0 ]; then
              echo "--- attente ($((i * 5)) s) ; adb : $(timeout 10 adb devices | tail -n +2 | tr '\n' ' ')"
              tail -3 emulateur.log
            fi
            sleep 5
          done
          echo "sys.boot_completed=$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
          timeout 10 adb shell input keyevent 82 || true
          timeout 10 adb shell settings put global window_animation_scale 0 || true
          timeout 10 adb shell settings put global transition_animation_scale 0 || true
          timeout 10 adb shell settings put global animator_duration_scale 0 || true
          timeout 10 adb devices -l
          echo "--- fin du journal de l'émulateur :"; tail -20 emulateur.log
          [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]

      - name: Tests instrumentés (Room sur la vraie base SQLite)
        run: |
          adb install -r -t apks/app-debug.apk
          adb install -r -t apks/app-debug-androidTest.apk
          adb shell am instrument -w -r mg.ecoledimanche.presences.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
          python3 .github/scripts/resume_instrumentation.py instrumentation.txt
          adb shell pm clear mg.ecoledimanche.presences

      - name: Parcours de l'application sur l'émulateur (mode avion)
        run: python3 .github/scripts/verification_emulateur.py

      - name: Diagnostic de l'émulateur
        if: ${{ !cancelled() }}
        run: |
          timeout 20 adb devices -l || true
          echo "--- journal de l'émulateur :"; tail -40 emulateur.log || true
          echo "--- /dev/kvm :"; ls -l /dev/kvm || true
          echo "--- logcat (erreurs) :"; timeout 30 adb logcat -d -t 150 '*:E' || true
