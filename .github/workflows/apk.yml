name: Construire l'APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Diagnostic
        run: |
          pwd
          ls -la
          echo "--- début du fichier gradlew :"
          head -c 60 gradlew | od -c
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
      - name: SDK Android 36 et licences
        continue-on-error: true
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Préparer gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
      - name: Construire l'APK de débogage
        run: sh ./gradlew :app:assembleDebug --stacktrace
      - name: Enregistrer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Tests unitaires
        if: always()
        continue-on-error: true
        run: sh ./gradlew :app:testDebugUnitTest
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests
          if-no-files-found: ignore
