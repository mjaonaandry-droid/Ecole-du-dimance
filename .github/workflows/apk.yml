name: Construire l'APK

# Ce fichier DOIT rester à la racine du dépôt (.github/workflows/) : GitHub ignore
# les workflows situés dans un sous-dossier. Le projet Android se trouve dans « Ecole-du-dimance/ ».
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write   # publication des sorties (APK, captures) sur la branche ci-sorties/<branche>
  actions: read     # téléchargement de l'APK 1.0.0 d'origine (test de migration)

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: Ecole-du-dimance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Cache des dépendances Gradle (et du cache de compilation) : les builds suivants sont bien plus rapides.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Ecole-du-dimance/**/*.gradle.kts', 'Ecole-du-dimance/gradle/libs.versions.toml', 'Ecole-du-dimance/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Le runner ubuntu-latest fournit déjà un SDK Android (ANDROID_HOME) : on s'assure seulement
      # de la présence de la plateforme 36 et des build-tools, et on accepte les licences.
      - name: SDK Android 36 et licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" \
            || sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # Clé de signature PERMANENTE (secrets du dépôt SIGNATURE_KEYSTORE_B64 et SIGNATURE_PASSWORD) :
      # sans elle, l'APK porte une clé de débogage jetable et ne pourra pas mettre à jour l'application
      # installée sur le téléphone. Voir transfert-donnees/LISEZMOI.txt, « Clé de signature ».
      - name: Clé de signature permanente
        env:
          SIGNATURE_KEYSTORE_B64: ${{ secrets.SIGNATURE_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNATURE_KEYSTORE_B64" ]; then
            echo "$SIGNATURE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ecole-dimanche.keystore"
            echo "SIGNATURE_KEYSTORE_FILE=$RUNNER_TEMP/ecole-dimanche.keystore" >> "$GITHUB_ENV"
            echo "Clé permanente trouvée : l'APK pourra mettre à jour l'application installée."
          else
            echo "::warning::Secret SIGNATURE_KEYSTORE_B64 absent : APK signé avec une clé de débogage JETABLE (il devra être re-signé avant d'être installé)."
          fi

      - name: Préparer gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Compiler l'APK de débogage
        env:
          SIGNATURE_PASSWORD: ${{ secrets.SIGNATURE_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Tests unitaires
        if: ${{ !cancelled() }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug --stacktrace --console=plain

      # Compile aussi les tests instrumentés (Room sur la vraie base) pour vérifier qu'ils restent compilables ;
      # ils ne sont PAS exécutés ici (il faudrait un appareil ou un émulateur).
      - name: Compiler l'APK des tests instrumentés
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --console=plain

      # La variante release doit aussi compiler (garde-fou INTERNET et lintVital inclus). Sans clé de signature
      # elle reste NON SIGNÉE, donc non installable : elle n'est volontairement pas publiée (voir README).
      - name: Compiler la variante release (non signée, non publiée)
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace --console=plain
          ls -l app/build/outputs/apk/release/

      # Contrôle indépendant de la permission INTERNET sur l'APK réellement produit.
      - name: Permissions déclarées par l'APK
        if: ${{ !cancelled() }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "Aucun APK produit."; exit 1; }
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "ERREUR : la permission INTERNET est présente dans l'APK."
            exit 1
          fi
          echo "OK : aucune permission INTERNET dans l'APK."

      - name: Enregistrer l'APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Ecole-du-dimance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Enregistrer les rapports (tests, lint)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            Ecole-du-dimance/app/build/reports/tests
            Ecole-du-dimance/app/build/reports/lint-results-debug.html
            Ecole-du-dimance/app/build/test-results
            Ecole-du-dimance/app/schemas
          if-no-files-found: ignore

      # Tout ce qui suit est AFFICHÉ dans le journal : les chiffres cités dans le README viennent de là.
      - name: Résumé vérifiable (tests, lint, APK, sauvegarde, schéma Room)
        if: ${{ !cancelled() }}
        run: |
          echo "################ TESTS UNITAIRES (rapports JUnit XML) ################"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = echecs = erreurs = ignores = 0
          fichiers = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          for chemin in fichiers:
              racine = ET.parse(chemin).getroot()
              n, f, e, s = (int(racine.get(k)) for k in ('tests', 'failures', 'errors', 'skipped'))
              total += n; echecs += f; erreurs += e; ignores += s
              print(f"  {racine.get('name').split('.')[-1]:48s} tests={n:3d} échecs={f} erreurs={e} ignorés={s}")
          print(f"TOTAL : {total} tests dans {len(fichiers)} classes, {echecs} échecs, {erreurs} erreurs, {ignores} ignorés")
          PY
          echo
          echo "################ LINT (lint-results-debug.xml) ################"
          python3 - <<'PY'
          import collections, os, xml.etree.ElementTree as ET
          chemin = 'app/build/reports/lint-results-debug.xml'
          if not os.path.exists(chemin):
              print("Pas de lint-results-debug.xml")
          else:
              anomalies = list(ET.parse(chemin).getroot().iter('issue'))
              print("Anomalies par sévérité :", dict(collections.Counter(a.get('severity') for a in anomalies)))
              for a in sorted(anomalies, key=lambda a: (a.get('severity'), a.get('id'))):
                  lieu = a.find('location')
                  lieu_txt = f"{lieu.get('file', '?').split('app/')[-1]}:{lieu.get('line', '?')}" if lieu is not None else '?'
                  print(f"  [{a.get('severity')}] {a.get('id')} — {a.get('message')[:150]} ({lieu_txt})")
          PY
          echo
          echo "################ APK ################"
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools utilisés : $BT"
          ls -l "$APK"
          sha256sum "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package:|sdkVersion|minSdkVersion|targetSdkVersion|application-label:|application-label-fr|launchable-activity|uses-feature|uses-implied-feature)" || true
          echo "--- Sauvegarde / réseau dans le manifeste de l'APK :"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "allowBackup|dataExtractionRules|fullBackupContent|usesCleartextTraffic|debuggable|android:name\(0x01010003\)=\"mg" || true
          echo "--- Signature de l'APK (clé de débogage Android) :"
          "$BT/apksigner" verify --verbose "$APK" 2>&1 | grep -E "^(Verifies|Verified using v2)" || true
          # Empreinte de la clé de débogage qui a signé l'APK (créée par la compilation si elle n'existe pas encore).
          KS="$HOME/.android/debug.keystore"
          if [ -f "$KS" ]; then
            keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA256|Valid from" || true
          else
            echo "Pas de debug.keystore dans $HOME/.android"
          fi
          echo "(Si cette empreinte change d'un build à l'autre, Android refuse d'installer le nouvel APK par-dessus l'ancien.)"
          echo
          echo "################ SCHÉMA ROOM ################"
          ls -l app/schemas/*/*.json
          sha256sum app/schemas/*/*.json
          # La compilation régénère le schéma sur place : s'il diffère du fichier versionné, git le voit.
          if git diff --quiet -- app/schemas; then
            echo "OK : le schéma généré par la compilation est identique au schéma versionné."
          else
            echo "ATTENTION : le schéma généré diffère du schéma versionné :"; git diff --stat -- app/schemas
          fi

  # -------------------------------------------------------------------------------------------
  # Passage 1.0.0 -> 1.1.0 sur émulateur avec l'APK EXACT installé chez l'utilisateur (clé
  # différente) : sauvegarde / désinstallation / installation / restauration par le script fourni,
  # comparaison des données octet pour octet, puis tour des nouveautés avec captures d'écran.
  # -------------------------------------------------------------------------------------------
  migration:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Activer KVM (émulateur accéléré)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Nouvel APK (ce build)
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: nouveau

      # APK 1.0.0 installé chez l'utilisateur : build du 09/10/2026 (exécution 37922545226).
      - name: Ancien APK (1.0.0, celui du téléphone)
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: ancien
          run-id: 37922545226
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Si l'APK final (re-signé avec la clé permanente) a été publié sur la branche livraison-apk,
      # c'est CE fichier qui est vérifié : exactement celui que l'utilisateur installera.
      - name: APK final signé (branche livraison-apk), sinon celui de ce build
        run: |
          if git fetch -q --depth 1 origin livraison-apk 2>/dev/null; then
            mkdir -p final
            git show FETCH_HEAD:ecole-du-dimance-1.1.0.apk > final/app.apk
            echo "APK vérifié : branche livraison-apk ($(sha256sum final/app.apk | cut -c1-16)…)"
          else
            mkdir -p final && cp nouveau/app-debug.apk final/app.apk
            echo "APK vérifié : celui de ce build"
          fi

      - name: Émulateur Android 14 et vérification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/test-migration.sh ancien/app-debug.apk final/app.apk

      - name: Enregistrer les sorties de la vérification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration
          path: ci-sorties
          if-no-files-found: warn

  # Le script Windows (.bat) que l'utilisateur lancera : syntaxe cmd et enchaînement vérifiés avec un faux adb.
  script-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive factice
        run: python ci/creer_fixture_windows.py ci-fixture
      - name: Scénarios du script .bat
        shell: pwsh
        run: ./ci/test-bat-windows.ps1

  # Les sorties sont aussi poussées sur une branche (ci-sorties/<branche>) pour être relues sans
  # passer par l'interface des artefacts.
  publier:
    needs: [apk, migration, script-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sorties
      - name: Pousser les sorties sur la branche ci-sorties
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sorties
          {
            echo "Branche : ${{ github.ref_name }}"
            echo "Commit : ${{ github.sha }}"
            echo "Exécution : ${{ github.run_id }}"
            echo "apk : ${{ needs.apk.result }} ; migration : ${{ needs.migration.result }} ; script-windows : ${{ needs.script-windows.result }}"
          } > ETAT.txt
          git init -q
          git checkout -q -b sorties
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Sorties CI ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "sorties:refs/heads/ci-sorties/${{ github.ref_name }}"
