name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Ecole-du-dimance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Droit d'exécution de gradlew
        run: chmod +x gradlew
      - name: Construire l'APK de débogage
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Enregistrer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Ecole-du-dimance/app/build/outputs/apk/debug/app-debug.apk
      - name: Tests unitaires
        if: always()
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: Ecole-du-dimance/app/build/reports/tests
          if-no-files-found: ignore
